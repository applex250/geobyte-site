<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Geobyte computational geology field model</title>
  <desc id="desc">A dark computational terrain visualization with layered contour lines, seismic traces, and a glowing geologic section.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050912"/>
      <stop offset=".48" stop-color="#111b31"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="62%">
      <stop offset="0" stop-color="#4d78bd" stop-opacity=".32"/>
      <stop offset=".46" stop-color="#23466f" stop-opacity=".13"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="strata" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76d3c3" stop-opacity=".15"/>
      <stop offset=".48" stop-color="#d9a76c" stop-opacity=".9"/>
      <stop offset="1" stop-color="#8aa9ff" stop-opacity=".2"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M-80 690 C190 500 350 700 570 540 S1010 355 1710 510" stroke="#84b9ff" stroke-opacity=".16" stroke-width="3"/>
    <path d="M-100 735 C180 545 342 750 590 590 S1030 410 1710 565" stroke="#8be0d1" stroke-opacity=".23" stroke-width="2"/>
    <path d="M-100 780 C160 600 350 800 610 640 S1060 465 1710 620" stroke="#f6c793" stroke-opacity=".36" stroke-width="3"/>
    <path d="M-80 825 C170 665 370 860 635 700 S1080 525 1700 680" stroke="#a4cdfb" stroke-opacity=".2" stroke-width="2"/>
    <path d="M-50 865 C210 725 390 905 675 760 S1110 590 1670 740" stroke="#d9a337" stroke-opacity=".28" stroke-width="2"/>
    <path d="M80 140 C350 300 500 120 770 250 S1200 420 1530 205" stroke="#7aa9ff" stroke-opacity=".16" stroke-width="2"/>
    <path d="M30 190 C330 345 510 170 785 300 S1200 465 1575 255" stroke="#74d8ca" stroke-opacity=".2" stroke-width="2"/>
    <path d="M20 245 C335 390 530 225 810 350 S1240 520 1600 315" stroke="#cda66d" stroke-opacity=".22" stroke-width="2"/>
  </g>
  <g opacity=".72" fill="none" stroke="#8eb7ff" stroke-width="1">
    <path d="M170 95 L170 805 M350 70 L350 845 M530 100 L530 790 M710 55 L710 850 M890 85 L890 820 M1070 60 L1070 845 M1250 105 L1250 805 M1430 70 L1430 840" stroke-opacity=".12" stroke-dasharray="3 17"/>
    <path d="M90 210 H1510 M55 360 H1545 M45 510 H1555 M30 660 H1570" stroke-opacity=".12" stroke-dasharray="4 20"/>
  </g>
  <g transform="translate(800 438)" fill="none" stroke-linecap="round">
    <ellipse rx="326" ry="210" stroke="#a7d4ff" stroke-opacity=".2" stroke-width="2"/>
    <ellipse rx="300" ry="190" stroke="#78dbc9" stroke-opacity=".26" stroke-width="2"/>
    <ellipse rx="270" ry="166" stroke="#e6b272" stroke-opacity=".33" stroke-width="3"/>
    <ellipse rx="220" ry="132" stroke="#8fb5ff" stroke-opacity=".4" stroke-width="2"/>
    <ellipse rx="162" ry="95" stroke="#f6d09a" stroke-opacity=".45" stroke-width="3"/>
    <path d="M-320 0 C-205-70-90-55 0-8 S205 60 320-8" stroke="url(#strata)" stroke-width="7" opacity=".8" filter="url(#soft)"/>
    <path d="M-290 24 C-170-35-70-30 10 13 S170 48 294-20" stroke="#9ce5d8" stroke-opacity=".65" stroke-width="2"/>
    <path d="M-235-35 C-125-90-45-73 40-31 S150-8 230-62" stroke="#9bbaff" stroke-opacity=".58" stroke-width="2"/>
  </g>
  <g fill="#c9e5ff">
    <circle cx="278" cy="244" r="3"/><circle cx="388" cy="632" r="2"/><circle cx="1218" cy="254" r="3"/><circle cx="1338" cy="650" r="2"/><circle cx="1040" cy="154" r="2"/><circle cx="610" cy="750" r="3"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#e8f3fe">
    <text x="86" y="90" font-size="18" letter-spacing="4" opacity=".55">GEOBYTE / FIELD MODEL 01</text>
    <text x="86" y="820" font-size="14" letter-spacing="3" opacity=".4">REMOTE SENSING · STRATA · SEISMIC SIGNAL</text>
    <text x="1510" y="820" text-anchor="end" font-size="14" letter-spacing="3" opacity=".4">EARTH / COMPUTE</text>
  </g>
</svg>
